<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs><clipPath id="plate"><rect x="16" y="16" width="480" height="480" rx="110"/></clipPath></defs>
  <rect x="16" y="16" width="480" height="480" rx="110" fill="#15171a"/>
  <g clip-path="url(#plate)">
  <!-- ending-bankroll histogram, shifted up-left to give the dice room -->
  <g fill="#ede7db" opacity="0.94">
    <rect x="130" y="216" width="34" height="140" rx="6"/>
    <rect x="172" y="156" width="34" height="200" rx="6"/>
    <rect x="214" y="112" width="34" height="244" rx="6"/>
    <rect x="256" y="84"  width="34" height="272" rx="6"/>
    <rect x="298" y="118" width="34" height="238" rx="6"/>
    <rect x="340" y="176" width="34" height="180" rx="6"/>
    <rect x="382" y="242" width="34" height="114" rx="6"/>
  </g>
  <!-- bust bar -->
  <rect x="76" y="140" width="34" height="216" rx="6" fill="#d25b4a"/>
  <!-- baseline -->
  <rect x="62" y="356" width="388" height="12" rx="6" fill="#3a3d42"/>
  <!-- the thrown seven: 4 + 3, big and bold so 32px still reads dice -->
  <g transform="translate(232 336) rotate(-10)">
    <rect width="152" height="152" rx="34" fill="#ede7db"/>
    <g fill="#15171a">
      <circle cx="46" cy="46" r="18"/><circle cx="106" cy="46" r="18"/>
      <circle cx="46" cy="106" r="18"/><circle cx="106" cy="106" r="18"/>
    </g>
  </g>
  <g transform="translate(366 372) rotate(12)">
    <rect width="132" height="132" rx="30" fill="#e0a93e"/>
    <g fill="#15171a">
      <circle cx="36" cy="36" r="16"/><circle cx="66" cy="66" r="16"/><circle cx="96" cy="96" r="16"/>
    </g>
  </g>
  </g>
</svg>
