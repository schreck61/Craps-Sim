name: Release

# Builds distributable binaries for Windows 11 (x86_64), macOS Apple Silicon
# (aarch64), and Linux (x86_64) when a version tag is pushed, and attaches
# them to a draft GitHub Release for review before publishing.
#
#   git tag v0.1.0 && git push origin v0.1.0

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  APP_NAME: craps-sim

jobs:
  build:
    name: Build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - label: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            archive: tar
          - label: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - name: Run tests
        run: cargo test --locked --release --target ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package (tar.gz)
        if: matrix.archive == 'tar'
        shell: bash
        run: |
          STAGE="${APP_NAME}-${GITHUB_REF_NAME}-${{ matrix.label }}"
          mkdir "$STAGE"
          cp "target/${{ matrix.target }}/release/${APP_NAME}" "$STAGE/"
          cp LICENSE README.md THIRD-PARTY-NOTICES.md "$STAGE/"
          cp -R licenses "$STAGE/licenses"
          tar czf "$STAGE.tar.gz" "$STAGE"
          echo "ASSET=$STAGE.tar.gz" >> "$GITHUB_ENV"

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $stage = "$env:APP_NAME-$env:GITHUB_REF_NAME-${{ matrix.label }}"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/$env:APP_NAME.exe" $stage
          Copy-Item LICENSE, README.md, THIRD-PARTY-NOTICES.md $stage
          Copy-Item -Recurse licenses "$stage/licenses"
          Compress-Archive -Path $stage -DestinationPath "$stage.zip"
          Add-Content -Path $env:GITHUB_ENV -Value "ASSET=$stage.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.label }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: assets
          merge-multiple: true
      - name: Create draft release and attach assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: assets/*
          draft: true
          generate_release_notes: true
