name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly advisory sweep so new RustSec advisories surface without a push.
    - cron: "0 6 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --locked --all-targets --release -- -D warnings
      - name: Attribution generator smoke test
        run: |
          cargo install cargo-bundle-licenses --locked
          python3 tools/generate_attributions.py /tmp/THIRD-PARTY-LICENSES.md
          test -s /tmp/THIRD-PARTY-LICENSES.md

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev
      - name: Run tests
        run: cargo test --workspace --locked --release
      - name: Build application
        run: cargo build --locked --release

  proofs:
    # The two proofs the strategy language leans on hardest. Both are
    # `#[ignore]` because they take minutes, and being ignored meant the
    # architecture's central safety argument — two player implementations
    # pinned to each other — was enforced by nobody. They run here instead of
    # in the matrix so the ordinary test job stays fast.
    name: Equivalence and performance proofs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Deep equivalence — compiled player against the hand-written one
        run: |
          cargo test --locked --release -p craps-engine -- --ignored --nocapture \
            deep_equivalence_compiled_matches_builtin
      - name: Performance budget
        # Its own step, filtered to the one test, single-threaded: the ratios
        # are meaningless measured beside the equivalence proof above, which
        # would otherwise be on every core at the same time.
        run: |
          cargo test --locked --release -p craps-engine -- --ignored --nocapture \
            --test-threads=1 bench_compiled

  snapshots:
    # Regenerates the headless pixel snapshots (UPDATE_SNAPSHOTS=1 writes
    # rather than compares, so image differences never fail the build) and
    # uploads them for review. The job fails only if a visual test panics.
    name: Visual snapshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev \
            mesa-vulkan-drivers libvulkan1
      - name: Regenerate pixel snapshots
        env:
          WGPU_BACKEND: vulkan
          UPDATE_SNAPSHOTS: "1"
        run: cargo test --locked --release -p craps-app -- --ignored visual_ --nocapture
      - name: Upload snapshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-snapshots
          path: crates/craps-app/tests/snapshots

  msrv:
    name: Minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev
      - name: Check with MSRV toolchain
        run: cargo check --workspace --locked --release

  deny:
    name: License policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Check dependency licenses
        run: cargo deny check licenses

  audit:
    name: Dependency advisories
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write # audit-check posts its report as a check run
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Mirrors deny.toml: ttf-parser is unmaintained but reaches us
          # only through winit's Wayland titlebar path; no fix exists yet.
          # (Un-ignored warnings also make the action file issues, which
          # this job has no permission to do.)
          ignore: RUSTSEC-2026-0192
