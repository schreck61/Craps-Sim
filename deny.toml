# cargo-deny configuration (https://embarkstudios.github.io/cargo-deny/).
# Checked in CI: every license in the dependency graph must be on this list.

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "OFL-1.1",
    # The Ubuntu Font Licence covers the egui-embedded Ubuntu font
    # (epaint_default_fonts); its text ships in licenses/ with every release.
    "Ubuntu-font-1.0",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "Unlicense",
]

[advisories]
ignore = [
    # ttf-parser is unmaintained; it reaches us only through
    # winit → sctk-adwaita → ab_glyph (Wayland titlebar rendering).
    # No fixed upgrade exists yet — drop this when winit moves off it.
    "RUSTSEC-2026-0192",
]
